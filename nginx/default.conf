server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx 自带 mime.types 未映射 .mjs，PDF Worker 以 module 方式加载会被浏览器拒绝
    types {
        application/javascript mjs;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端使用 HashRouter，其余路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}