server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端使用 HashRouter，其余路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}